name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: validate manifest
        run: node tools/validate.js

      - name: unit tests
        run: node test-background.js

      - name: package
        run: |
          mkdir -p dist
          zip -r dist/whatsapp-web-deluxe.zip manifest.json background.js privacy.md icons
          ls -l dist
          sha256sum dist/whatsapp-web-deluxe.zip

      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-web-deluxe
          path: dist/whatsapp-web-deluxe.zip
